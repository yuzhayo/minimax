name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Build and test the shared local path
        shell: pwsh
        env:
          CI: 'true'
        run: ./tools/Test.ps1 -Configuration Release
      - name: Validate portable package
        shell: pwsh
        env:
          CI: 'true'
        run: ./tools/Build-Portable.ps1
      - name: Upload portable candidate
        uses: actions/upload-artifact@v7
        with:
          name: minimax-portable-${{ github.sha }}
          path: |
            artifacts/releases/MiniMax-v*-win-x64-portable.zip
            artifacts/releases/MiniMax-v*-win-x64-portable.zip.sha256
          if-no-files-found: error
